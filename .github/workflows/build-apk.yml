name: 안드로이드 앱(APK) 빌드

# 앱 껍데기(android/)가 바뀔 때만 새로 빌드해 '최신 릴리스'로 올린다.
# 화면·데이터 변경은 앱이 사이트를 그대로 읽어서 자동 반영되므로 다시 빌드할 필요가 없다.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 서명 키: Secrets에 있으면 그걸 쓴다(업데이트 설치 가능).
      # 없으면 임시 키로 빌드한다 — 이 경우 다음 버전은 지우고 다시 설치해야 한다.
      - name: 서명 키 준비
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD Secret이 없어 임시 키로 서명합니다. 다음 버전은 기존 앱을 지우고 설치해야 합니다."
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" -alias rndinner \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=R&Dinner"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            KS_PW="$PW"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          # 키 안의 별칭은 키를 만들 때 정해지므로 코드에 적지 않고 키에서 읽는다
          ALIAS=$(keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" -storepass "$KS_PW" | grep -m1 PrivateKeyEntry | cut -d, -f1)
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: APK 빌드
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # 빌드 로그는 로그인해야 보이므로, 실패 원인을 실행 화면 Annotations에도 남긴다
      - name: 실패 원인 요약
        if: failure()
        working-directory: android
        run: |
          grep -E "error:|e: |What went wrong|Could not|FAILURE|Exception|> " build.log | grep -v "^\s*at " | head -25 | while IFS= read -r line; do
            echo "::error::${line:0:300}"
          done

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk rndinner.apk

      # 어떤 키로 서명됐는지 실행 화면에 남긴다(정식 키면 매번 같은 지문)
      - name: 서명 확인
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          FP=$("$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs rndinner.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "::notice::APK 서명 인증서 SHA-256: $FP"

      - name: 최신 릴리스로 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: R&Dinner 앱 1.0.${{ github.run_number }}
          body: |
            휴대폰에서 아래 rndinner.apk를 눌러 설치하세요.
            화면·데이터는 사이트에서 바로 읽으므로 웹을 고치면 앱에도 자동 반영됩니다.
          files: rndinner.apk
          make_latest: true

      # 예전 버전(임시 키로 서명된 것 포함)을 받아 설치하는 일이 없게, 방금 올린 것만 남기고 지운다
      - name: 이전 릴리스 정리
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: app-v1.0.${{ github.run_number }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ "$tag" = "$KEEP" ] && continue
            echo "삭제: $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
