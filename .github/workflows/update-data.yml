name: 일반음식점 데이터 갱신

# 자동 예약 실행 없음: 필요할 때 Actions 탭 → Run workflow 로만 갱신한다.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install pyproj

      - name: 데이터 받기
        env:
          # 기본은 CSV 내려받기(키 불필요). 실패하면 이 키로 Open API를 대신 쓴다.
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          SEOUL_SERVICES: ${{ vars.SEOUL_SERVICES || 'LOCALDATA_072404_GN' }}
        run: python scripts/fetch_data.py

      - name: 변경 시 커밋
        run: |
          git config user.name "restaurant-data-bot"
          git config user.email "actions@users.noreply.github.com"
          # 수집(약 10분) 중에 다른 커밋이 올라왔을 수 있다 → 최신 main 위에 새 데이터만 얹는다
          cp data/restaurants.json "$RUNNER_TEMP/restaurants.json"
          git fetch -q origin main
          git reset -q --hard origin/main
          cp "$RUNNER_TEMP/restaurants.json" data/restaurants.json
          git add data/restaurants.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
