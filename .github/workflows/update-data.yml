name: 일반음식점 데이터 갱신

on:
  schedule:
    # 매일 06:30 KST (= 21:30 UTC). 서울시 데이터가 새벽에 갱신된 뒤 받아온다.
    - cron: "30 21 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install pyproj

      - name: 데이터 받기
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          SEOUL_SERVICES: ${{ vars.SEOUL_SERVICES || 'LOCALDATA_072404_GN' }}
        run: python scripts/fetch_data.py

      - name: 변경 시 커밋
        run: |
          git config user.name "restaurant-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/restaurants.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
